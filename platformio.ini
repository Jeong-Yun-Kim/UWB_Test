[platformio]
default_envs = laptop_node
src_dir = esp32/src

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 460800
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/thotro/arduino-dw1000.git#v0.9
extra_scripts =
    pre:esp32/scripts/patch_dw1000_esp32.py

[env:laptop_node]
build_src_filter =
    -<*>
    +<uwb_node/>
build_flags =
    -D NODE_ID=1
    -D PEER_ID=2

[env:jetson_node]
build_src_filter =
    -<*>
    +<uwb_node/>
build_flags =
    -D NODE_ID=2
    -D PEER_ID=1

[env:pingpong_laptop]
build_src_filter =
    -<*>
    +<uwb_pingpong/>
build_flags =
    -D PINGPONG_INITIATOR=1

[env:pingpong_jetson]
build_src_filter =
    -<*>
    +<uwb_pingpong/>
build_flags =
    -D PINGPONG_INITIATOR=0
