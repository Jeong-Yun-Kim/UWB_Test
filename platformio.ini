[platformio]
default_envs = laptop_node
src_dir = esp32/src

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 460800
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/F-Army/arduino-dw1000-ng.git#e83532002311d0f9028513312b214f8ee1fe382b

[env:laptop_node]
build_src_filter =
    -<*>
    +<uwb_node/>
build_flags =
    -D NODE_ID=1
    -D PEER_ID=2

[env:jetson_node]
build_src_filter =
    -<*>
    +<uwb_node/>
build_flags =
    -D NODE_ID=2
    -D PEER_ID=1
